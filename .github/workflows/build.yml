name: 构建全平台发行版

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: "手动指定版本号（留空则自动：打了 v* 标签用标签，否则 pubspec 版本-dev.短提交）"
        type: string
        required: false
        default: ''
      skip_apple:
        description: "跳过 macOS / iOS 构建（macOS runner 按 10 倍分钟计费）"
        type: boolean
        default: false

# 默认只读，只有 release 任务单独提权，避免 token 权限过大
permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  # 与本地验证过的版本保持一致，避免 SDK 升级引入未知问题
  FLUTTER_VERSION: '3.47.6'
  BUNDLETOOL_VERSION: '1.18.3'

jobs:
  # ====================================================================
  # 质量门禁：不通过就不浪费后面五个平台的构建时间
  # ====================================================================
  quality:
    name: 静态检查与单元测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: 获取依赖
        run: flutter pub get

      - name: 静态分析
        run: dart analyze

      - name: 单元测试
        run: flutter test

  # ====================================================================
  # 版本号：打了 v1.2.3 标签就用标签，否则用 pubspec 版本 + 短 commit
  # ====================================================================
  meta:
    name: 解析版本号
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - id: v
        shell: bash
        env:
          # 手动触发时可以填版本号；tag push 时 inputs 为空，走下面的自动分支
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          # 优先级：手动填的 > 标签 > pubspec 版本 + 短提交
          raw="${INPUT_VERSION#v}"
          if [[ -n "$raw" ]]; then
            version="$raw"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            base="$(sed -n 's/^version: *//p' pubspec.yaml | cut -d+ -f1)"
            version="${base}-dev.${GITHUB_SHA::7}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "版本号 -> $version"

  # ====================================================================
  # Android：AAB -> bundletool .apks（全架构）+ 按 ABI 拆分的多架构 APK
  # 唯一自签的平台
  # ====================================================================
  android:
    name: Android (.apks + 多架构 APK)
    needs: [quality, meta]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: 接受 Android SDK / NDK 许可
        shell: bash
        run: |
          sdkmanager="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [[ -x "$sdkmanager" ]]; then
            yes | "$sdkmanager" --licenses > /dev/null || true
            echo "SDK 许可已接受"
          else
            echo "未找到 sdkmanager，跳过（ runner 可能已接受过许可）"
          fi

      - name: 获取依赖
        run: flutter pub get

      # ---------------------------------------------------------- 自签密钥
      - name: 准备自签密钥
        shell: bash
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ks="$RUNNER_TEMP/release.jks"
          storepass="${ANDROID_KEYSTORE_PASSWORD:-cmsplayer-ci}"
          alias="${ANDROID_KEY_ALIAS:-cmsplayer}"
          keypass="${ANDROID_KEY_PASSWORD:-$storepass}"

          if [[ -n "${ANDROID_KEYSTORE_B64:-}" ]]; then
            printf '%s' "$ANDROID_KEYSTORE_B64" | base64 -d > "$ks"
            echo "使用仓库 Secret 中保存的密钥（多次发布的签名一致，可覆盖安装）"
          else
            keytool -genkeypair -v \
              -keystore "$ks" -storetype PKCS12 \
              -storepass "$storepass" -keypass "$keypass" \
              -alias "$alias" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=CMSPlayer CI, OU=Self-Signed, O=CMSPlayer, L=NA, S=NA, C=US"
            echo "本次运行新生成的自签密钥（每次签名都不同）"
            echo "提示：配置 ANDROID_KEYSTORE_B64 等 Secret 可让签名跨版本保持一致"
          fi

          # storeType 写死 PKCS12：不管 keystore 是 CI 现签的还是 Secret 里那份
          # （openssl 产物或 keytool 产物）都是 PKCS12，格式不再依赖 AGP 的默认猜测。
          printf 'storeType=PKCS12\nstorePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=%s\n' \
            "$storepass" "$keypass" "$alias" "$ks" > android/key.properties

          {
            echo "KS_PATH=$ks"
            echo "KS_PASS=$storepass"
            echo "KS_ALIAS=$alias"
            echo "KEY_PASS=$keypass"
          } >> "$GITHUB_ENV"

      # ------------------------------------------------------------- 构建
      - name: 构建 App Bundle（AAB）
        run: flutter build appbundle --release

      - name: 构建多架构 APK（按 ABI 拆分）
        run: flutter build apk --split-per-abi --release

      - name: 生成 .apks 并整理产物
        shell: bash
        run: |
          set -euo pipefail
          v="${{ needs.meta.outputs.version }}"
          mkdir -p "dist/CMSPlayer-$v-android-abi-splits"

          jar="$RUNNER_TEMP/bundletool.jar"
          curl -fsSL -o "$jar" \
            "https://github.com/google/bundletool/releases/download/${BUNDLETOOL_VERSION}/bundletool-all-${BUNDLETOOL_VERSION}.jar"

          aab="$(find build/app/outputs/bundle/release -name '*.aab' -print -quit)"
          if [[ -z "$aab" ]]; then
            echo "错误: 没有找到 AAB，请检查 flutter build appbundle 是否成功" >&2
            exit 1
          fi
          java -jar "$jar" build-apks \
            --bundle="$aab" \
            --output="dist/CMSPlayer-$v-android.apks" \
            --mode=universal \
            --overwrite \
            --ks="$KS_PATH" \
            --ks-pass="pass:$KS_PASS" \
            --ks-key-alias="$KS_ALIAS" \
            --key-pass="pass:$KEY_PASS"

          # .apks 本质是 zip，universal.apk 里含全部 ABI，解出来方便手动安装
          unzip -o -j "dist/CMSPlayer-$v-android.apks" universal.apk -d dist
          mv "dist/universal.apk" "dist/CMSPlayer-$v-android-universal.apk"

          for abi in armeabi-v7a arm64-v8a x86_64; do
            cp "build/app/outputs/flutter-apk/app-$abi-release.apk" \
               "dist/CMSPlayer-$v-android-abi-splits/CMSPlayer-$abi.apk"
          done

          find dist -type f -printf '  %10s  %p\n'

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/
          if-no-files-found: error
          compression-level: 0

  # ====================================================================
  # Windows：Release 目录整体压 zip，不签名
  # ====================================================================
  windows:
    name: Windows (.zip)
    needs: [quality, meta]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: 获取依赖
        run: flutter pub get

      - name: 构建 Windows 发行版
        run: flutter build windows --release

      - name: 打包 zip
        shell: pwsh
        run: |
          $v = "${{ needs.meta.outputs.version }}"
          # zip 内直接放文件，不再套一层 cmsplayer-windows-x64 ——
          # 解压后拿到的就是 exe / dll，不必再点进一层目录。
          # staging 目录仍要用，否则 Compress-Archive 会把 Release 下的
          # 东西连同无关文件一起收进去。
          $stage = "dist/cmsplayer-windows-x64"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "build/windows/x64/runner/Release/*" $stage -Recurse -Force
          Compress-Archive -Path "$stage\*" -DestinationPath "dist/CMSPlayer-$v-windows-x64.zip" -Force
          Get-ChildItem -Recurse dist | Select-Object FullName, Length

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.zip
          if-no-files-found: error
          compression-level: 0

  # ====================================================================
  # macOS：DMG，项目里三套构建配置的 CODE_SIGN_IDENTITY 已是 "-"
  # （ad-hoc），没有 Apple 开发者证书、也不做公证
  # ====================================================================
  macos:
    name: macOS (.dmg)
    needs: [quality, meta]
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.skip_apple }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: arm64
          cache: true

      - name: 获取依赖
        run: flutter pub get

      - name: 构建 macOS 应用
        run: flutter build macos --release

      - name: 打包 DMG（ad-hoc 签名，无 Apple 证书、未公证）
        shell: bash
        run: |
          set -euo pipefail
          v="${{ needs.meta.outputs.version }}"
          stage="$RUNNER_TEMP/dmg"
          mkdir -p "$stage" dist
          cp -R build/macos/Build/Products/Release/*.app "$stage/"
          ln -s /Applications "$stage/Applications"
          hdiutil create -volname "CMSPlayer" -srcfolder "$stage" -ov -format UDZO \
            "dist/CMSPlayer-$v-macos-universal.dmg"
          ls -lh dist

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*.dmg
          if-no-files-found: error
          compression-level: 0

  # ====================================================================
  # Linux：一次构建产出 5 种发行格式，全部经 bundle-linux.sh 收库成免依赖版
  #   1) 解压即用的便携 tar.gz（仅 glibc 必须来自系统）
  #   2) deb / rpm / pacman —— 交给 fastforge 打包
  #   3) AppImage —— fastforge 的 appimage maker 有缺陷（详见下面那步的注释），
  #      改为直接用 appimagetool 打包同一个已经收好库的 bundle
  # fastforge 是已停止维护的 flutter_distributor 的官方继任者（同作者改名），
  # 它自己会 clean + build，多个 target 复用同一次构建（isBuildOnlyOnce）。
  # ====================================================================
  linux:
    name: Linux (tar.gz + deb/rpm/pacman/AppImage)
    needs: [quality, meta]
    # 显式钉住 24.04：ubuntu-latest 自 2026-10 起切到 26.04，
    # glibc 版本会跟着变，免依赖包的最低 glibc 要求也就跟着变。
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: 安装构建依赖
        run: |
          sudo apt-get update
          # libasound2-dev：volume_controller 的 linux/CMakeLists.txt 有 find_package(ALSA REQUIRED)。
          #
          # libmpv-dev / libepoxy-dev：media_kit_video 的 linux/CMakeLists.txt 会
          #   pkg_check_modules(mpv IMPORTED_TARGET mpv)
          #   pkg_check_modules(epoxy IMPORTED_TARGET epoxy)
          #   再 target_link_libraries 到 PkgConfig::mpv / PkgConfig::epoxy。
          #   注意 Linux 端不自带这两个库：media_kit_libs_video 压根没有 linux 目录，
          #   而 media_kit_libs_linux（media_kit 的传递依赖）只下载 mimalloc，
          #   所以只能靠系统的 -dev 包提供头文件与 .pc。
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config libgtk-3-dev \
            libasound2-dev libmpv-dev libepoxy-dev patchelf file \
            rpm libarchive-tools xz-utils

      - name: 安装 fastforge
        run: |
          set -euo pipefail
          dart pub global activate fastforge
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: 安装 appimagetool
        shell: bash
        run: |
          set -euo pipefail
          # appimagetool 本身是个 AppImage，直接跑要靠 FUSE 挂载，而 CI 环境
          # 不一定有 FUSE（Ubuntu 24.04 起也没有 libfuse2 了）。
          # 改用它自带的 --appimage-extract 解包，再用一个壳脚本转调里面的 AppRun，
          # 这条路完全不碰 FUSE。fastforge 是按 PATH 找 "appimagetool" 的。
          curl -fsSL -o "$RUNNER_TEMP/appimagetool" \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x "$RUNNER_TEMP/appimagetool"
          (cd "$RUNNER_TEMP" && ./appimagetool --appimage-extract > /dev/null)
          sudo mv "$RUNNER_TEMP/squashfs-root" /opt/appimagetool
          printf '#!/bin/sh\nexec /opt/appimagetool/AppRun "$@"\n' \
            | sudo tee /usr/local/bin/appimagetool > /dev/null
          sudo chmod +x /usr/local/bin/appimagetool

      - name: 获取依赖
        run: flutter pub get

      - name: 打包 deb / rpm / pacman
        shell: bash
        run: |
          set -euo pipefail
          # --hook-pre 在「构建完成之后、打包之前」执行，hook 内能拿到环境变量
          # BUILD_OUTPUT_DIRECTORY，即 flutter build linux 产出的 bundle 路径。
          # 借此把我们收库 + 改 RPATH 的脚本挂进去，4 种格式就都是免依赖的。
          # hook 每个 target 各跑一次，脚本内部有幂等哨兵，只会真正执行一遍。
          # --skip-clean：工作区本来就是干净的，省掉一次 flutter clean。
          fastforge package \
            --platform=linux \
            --targets=deb,rpm,pacman \
            --skip-clean \
            --hook-pre 'bash .github/scripts/bundle-linux.sh "$BUILD_OUTPUT_DIRECTORY"'

          ls -lhR dist

      - name: 打包 AppImage
        shell: bash
        run: |
          set -euo pipefail
          v="${{ needs.meta.outputs.version }}"
          bundle="build/linux/x64/release/bundle"
          appdir="$RUNNER_TEMP/CMSPlayer.AppDir"

          # 这里刻意不走 fastforge 的 appimage maker：它会对 AppDir/lib/ 下的
          # 每个 .so 跑一遍 ldd -d，把解析到的库再拷一份进 usr/lib/。
          # 而 ldd 对未解析依赖只会打 "libjvm.so => not found"，maker 却把
          # "=> " 后面的第一段当路径直接 cp，于是报
          #   cp: cannot stat 'not': No such file or directory
          # 我们这个 bundle 本来就已经自包含（RPATH 指向 $ORIGIN:$ORIGIN/lib），
          # 它要做的这件事纯属多余，所以改成直接用 appimagetool 打包，
          # 一个 ldd 都不用跑。
          rm -rf "$appdir"
          cp -r "$bundle" "$appdir"

          # AppImage 的入口脚本。二进制的 RPATH 已经指向同目录的 lib/，
          # 这里再显式补一层 LD_LIBRARY_PATH 兜底。
          # 用 printf 逐行拼而不是 heredoc：YAML 块标量会剥掉缩进，
          # heredoc 的结束定界符位置很容易在多层缩进里写错。
          printf '%s\n' \
            '#!/bin/sh' \
            'cd "$(dirname "$0")"' \
            'export LD_LIBRARY_PATH="$PWD/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"' \
            'exec ./cms_player "$@"' \
            > "$appdir/AppRun"
          chmod +x "$appdir/AppRun"

          printf '%s\n' \
            '[Desktop Entry]' \
            'Type=Application' \
            'Name=CMSPlayer' \
            'GenericName=视频播放器' \
            'Comment=macCMS / 苹果CMS 资源站播放器' \
            'Exec=cms_player %U' \
            'Icon=cms_player' \
            'Terminal=false' \
            'Categories=AudioVideo;Video;' \
            'Keywords=CMS;macCMS;VOD;Player;' \
            'StartupNotify=true' \
            > "$appdir/cms_player.desktop"

          # AppDir 根下要有一份与 .desktop 里 Icon= 同名的图标，
          # appimagetool 靠它做应用图标；顺手也放一份到 hicolor 目录。
          cp assets/icons/app_icon.png "$appdir/cms_player.png"
          mkdir -p "$appdir/usr/share/icons/hicolor/256x256/apps"
          cp assets/icons/app_icon.png \
             "$appdir/usr/share/icons/hicolor/256x256/apps/cms_player.png"

          # PATH 上装的是 appimagetool 解包后的 AppRun，已经绕开了 FUSE
          ARCH=x86_64 appimagetool --no-appstream \
            "$appdir" "dist/CMSPlayer-$v-linux-x64.AppImage"

      - name: 打包免依赖便携版并统一命名
        shell: bash
        run: |
          set -euo pipefail
          v="${{ needs.meta.outputs.version }}"
          bundle="build/linux/x64/release/bundle"

          # 上一步的 hook 已经把动态库收进 bundle/lib/ 并改好了 RPATH，
          # 这里再调一次会命中幂等哨兵直接返回，不会重复处理。
          bash .github/scripts/bundle-linux.sh "$bundle"

          mkdir -p dist
          mv "$bundle" dist/CMSPlayer-linux-x64
          tar -C dist -czf "dist/CMSPlayer-$v-linux-x64-portable.tar.gz" CMSPlayer-linux-x64
          rm -rf dist/CMSPlayer-linux-x64

          # fastforge 的产物落在 dist/<pubspec版本>/ 下，文件名是它自己的默认规则，
          # 这里改成本发行版统一的命名。后缀取自 packageFormat。
          for f in dist/*/cms_player-*-linux.*; do
            [ -e "$f" ] || continue
            case "$f" in
              *.deb)    out="CMSPlayer-$v-linux-x64.deb" ;;
              *.rpm)    out="CMSPlayer-$v-linux-x64.rpm" ;;
              *.pacman) out="CMSPlayer-$v-linux-x64.pacman.pkg.tar.xz" ;;
              *) continue ;;
            esac
            mv "$f" "dist/$out"
          done

          # 清掉 fastforge 留下的空版本目录，免得被一起打包成 artifact
          find dist -mindepth 1 -maxdepth 1 -type d -empty -delete
          chmod +x dist/*.AppImage 2>/dev/null || true
          ls -lh dist

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*
          if-no-files-found: error
          compression-level: 0

  # ====================================================================
  # iOS：--no-codesign，只打成未签名 IPA 供后续自行重签
  # ====================================================================
  ios:
    name: iOS (.ipa，未签名)
    needs: [quality, meta]
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.skip_apple }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: arm64
          cache: true

      - name: 获取依赖
        run: flutter pub get

      - name: 构建 iOS 应用（不签名）
        run: flutter build ios --release --no-codesign

      - name: 打包 IPA（未签名）
        shell: bash
        run: |
          set -euo pipefail
          v="${{ needs.meta.outputs.version }}"
          work="$RUNNER_TEMP/ipa"
          mkdir -p "$work/Payload" dist
          cp -R build/ios/iphoneos/Runner.app "$work/Payload/"
          (cd "$work" && zip -qry "$GITHUB_WORKSPACE/dist/CMSPlayer-$v-ios-unsigned.ipa" Payload)
          ls -lh dist

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: ios
          path: dist/*.ipa
          if-no-files-found: error
          compression-level: 0

  # ====================================================================
  # 发布：只有打 v* 标签时才创建 GitHub Release
  # ====================================================================
  release:
    name: 发布到 GitHub Releases
    needs: [quality, meta, android, windows, macos, linux, ios]
    # macos / ios 可能被 skip_apple 跳过，这里要显式放行
    if: |
      always() &&
      !cancelled() &&
      startsWith(github.ref, 'refs/tags/v') &&
      needs.quality.result == 'success' &&
      needs.meta.result == 'success' &&
      needs.android.result == 'success' &&
      needs.windows.result == 'success' &&
      needs.linux.result == 'success' &&
      (needs.macos.result == 'success' || needs.macos.result == 'skipped') &&
      (needs.ios.result == 'success' || needs.ios.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 汇总所有产物
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 列出待发布文件
        run: find dist -type f -printf '%10s  %p\n' | sort -k2

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          name: CMSPlayer ${{ needs.meta.outputs.version }}
          files: dist/**
          fail_on_unmatched_files: true
          generate_release_notes: true
