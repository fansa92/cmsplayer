# fastforge 的 appimage maker 配置
# 路径固定为 linux/packaging/appimage/make_config.yaml，由 appimage maker 写死。
#
# 产物是单文件 AppImage，自带全部动态库，解压即用。
# maker 会把 bundle/lib/ 里除 libapp.so / libflutter_linux_gtk.so / libgtk-3.so.0
# 之外的库额外复制到 AppDir/usr/lib/，并生成 AppRun 设置 LD_LIBRARY_PATH=usr/lib。
display_name: CMSPlayer

# AppImage maker 的 icon 是必填项（没有默认值），路径相对项目根目录。
icon: assets/icons/app_icon.png

generic_name: 视频播放器

# appimage maker 对 categories / keywords 用的是 join(';')，
# 不像 deb / pacman 那样自动补结尾的分号。freedesktop 规范要求以分号结尾，
# 所以这里在列表末尾补一个空字符串，join 出来正好是 "AudioVideo;Video;"。
categories:
  - AudioVideo
  - Video
  - ''
keywords:
  - CMS
  - macCMS
  - VOD
  - Player
  - 播放器
  - ''

startup_notify: true

# 不填 include：maker 只有在 include 非空时才会调 locate，
# 这样 CI 里就不必安装 mlocate/plocate。

# AppImage 的 desktop 文件里 Exec 被写死成 "LD_LIBRARY_PATH=usr/lib <name> %u"，
# 所以应用必须叫 cms_player（= pubspec 的 name），这点由 BINARY_NAME 保证。
